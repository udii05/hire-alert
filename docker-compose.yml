version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hire-alert-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hire_alert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hire-alert-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hire-alert-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hire_alert"
      DATABASE_URL_SYNC: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hire_alert"
      REDIS_URL: "redis://redis:6379/0"
      BACKEND_API_KEY: ${BACKEND_API_KEY:?BACKEND_API_KEY is not set. Add it to the root .env file.}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hire-alert-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hire_alert"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is not set. Add it to the root .env file.}
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
      BACKEND_API_KEY: ${BACKEND_API_KEY:?BACKEND_API_KEY is not set. Add it to the root .env file.}
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:


